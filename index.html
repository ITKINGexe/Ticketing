  adminBranch:'all', adminSearch:'', adminMsgOpen:null, historyOpen:false,
  formState:{name:'',employeeId:'',team:'',branch:'',problem:'',description:''},
  formError:null, duplicateInfo:null, audioCtx:null, ticketSnapshot:null,
  tickets:[]
};

/* UTIL */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function pad2(n){ return n<10?'0'+n:''+n; }
function todayKey(){ const d=new Date(); return pad2(d.getMonth()+1)+pad2(d.getDate()); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2400);
}

function timeAgo(ms){
  const s = Math.max(0, Math.floor((Date.now()-ms)/1000));
  if(s<60) return s+'s';
  const m = Math.floor(s/60);
  if(m<60) return m+'m';
  const h = Math.floor(m/60);
  return h+'h';
}

function countdown(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60); const r = s%60;
  return m+':'+pad2(r);
}

/* AUDIO ALERT */
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch(e) {}
}

/* SUPABASE MAPPING & STORAGE HELPERS */
function mapFromDb(row) {
  if (!row) return null;
  return {
    id: row.id,
    ticketNumber: row.ticket_number,
    name: row.name,
    employeeId: row.employee_id,
    team: row.team,
    branch: row.branch,
    problem: row.problem,
    description: row.description || '',
    status: row.status,
    submittedAt: Number(row.submitted_at),
    calledAt: row.called_at ? Number(row.called_at) : null,
    lastPingAt: row.last_ping_at ? Number(row.last_ping_at) : null,
    pingCount: row.ping_count || 0,
    message: row.message || null,
    messageAt: row.message_at ? Number(row.message_at) : null
  };
}

function mapToDb(t) {
  return {
    id: t.id,
    ticket_number: t.ticketNumber,
    name: t.name,
    employee_id: t.employeeId,
    team: t.team,
    branch: t.branch,
    problem: t.problem,
    description: t.description || '',
    status: t.status,
    submitted_at: t.submittedAt,
    called_at: t.calledAt,
    last_ping_at: t.lastPingAt,
    ping_count: t.pingCount,
    message: t.message,
    message_at: t.messageAt
  };
}

async function getTicket(id) {
  if (!id) return null;
  try {
    const { data, error } = await supabaseClient.from('tickets').select('*').eq('id', id).maybeSingle();
    if (error || !data) return null;
    return mapFromDb(data);
  } catch(e) { return null; }
}

async function saveTicket(t) {
  try {
    const dbRecord = mapToDb(t);
    await supabaseClient.from('tickets').upsert(dbRecord);
  } catch(e) {}
}

async function listTickets() {
  try {
    const { data, error } = await supabaseClient.from('tickets').select('*').order('submitted_at', { ascending: true });
    if (error || !data) return [];
    return data.map(mapFromDb);
  } catch(e) { return []; }
}

/* TICKET NUMBER GENERATOR */
async function generateTicketNumber(branch) {
  const code = BRANCH_CODES[branch] || "GEN";
  const prefix = code + todayKey();
  const all = await listTickets();
  const matching = all.filter(t => t.ticketNumber && t.ticketNumber.startsWith(prefix));
  let maxSeq = 0;
  matching.forEach(t => {
    const seqStr = t.ticketNumber.slice(prefix.length);
    const seq = parseInt(seqStr, 10);
    if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
  });
  return prefix + pad2(maxSeq + 1);
}

/* ACTIONS */
async function submitForm(e) {
  e.preventDefault();
  const f = state.formState;
  if (!f.name || !f.employeeId || !f.team || !f.branch || !f.problem || !f.description) {
    state.formError = tt('formRequired');
    render();
    return;
  }
  
  const all = await listTickets();
  const open = all.find(t => t.employeeId === f.employeeId && ['waiting','called','in_progress'].includes(t.status));
  if (open) {
    state.duplicateInfo = open;
    render();
    return;
  }

  const ticketNum = await generateTicketNumber(f.branch);
  const newTicket = {
    id: uid(),
    ticketNumber: ticketNum,
    name: f.name,
    employeeId: f.employeeId,
    team: f.team,
    branch: f.branch,
    problem: f.problem,
    description: f.description,
    status: 'waiting',
    submittedAt: Date.now(),
    calledAt: null,
    lastPingAt: null,
    pingCount: 0,
    message: null,
    messageAt: null
  };

  await saveTicket(newTicket);
  state.myTicketId = newTicket.id;
  localStorage.setItem('my_ticket_id', newTicket.id);
  state.route = 'status';
  state.formError = null;
  state.duplicateInfo = null;
  render();
}

async function handlePing() {
  if (!state.ticketSnapshot) return;
  const t = state.ticketSnapshot;
  const now = Date.now();
  if (t.lastPingAt && (now - t.lastPingAt < PING_COOLDOWN_MS)) return;
  
  t.lastPingAt = now;
  t.pingCount = (t.pingCount || 0) + 1;
  await saveTicket(t);
  toast(tt('pingSent'));
  render();
}

async function updateStatus(id, newStatus) {
  const t = await getTicket(id);
  if (!t) return;
  t.status = newStatus;
  if (newStatus === 'called') t.calledAt = Date.now();
  await saveTicket(t);
  if (newStatus === 'called') toast(tt('toastCalled'));
  render();
}

async function sendAdminMessage(id, msg) {
  if (!msg.trim()) return;
  const t = await getTicket(id);
  if (!t) return;
  t.message = msg;
  t.messageAt = Date.now();
  await saveTicket(t);
  state.adminMsgOpen = null;
  toast(tt('toastMsgSent'));
  render();
}

/* RENDERING */
function renderTopbar() {
  return `
    <header class="topbar">
      <div class="brand"><div class="dot"></div>${tt('appTitle')}</div>
      <div class="topbar-controls">
        <select class="control" onchange="state.lang=this.value; render();">
          ${['en','ur','hi','ne','am'].map(l => `<option value="${l}" ${state.lang===l?'selected':''}>${l.toUpperCase()}</option>`).join('')}
        </select>
        <button class="iconbtn" onclick="state.theme=state.theme==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme',state.theme);">
          ${state.theme==='light'?'🌙':'☀️'}
        </button>
      </div>
    </header>
  `;
}

async function renderApp() {
  const root = document.getElementById('app');
  let bodyContent = '';

  if (state.route === 'form') {
    bodyContent = `
      <div class="card">
        <h1>${tt('appTitle')}</h1>
        <div class="sub">${tt('appSubtitle')}</div>
        ${state.formError ? `<div class="notice warn">${state.formError}</div>` : ''}
        ${state.duplicateInfo ? `
          <div class="notice warn">
            <strong>${tt('formDuplicateTitle')}</strong><br>
            ${fmt(tt('formDuplicateBody'), {number: state.duplicateInfo.ticketNumber})}
          </div>
        ` : ''}
        <form onsubmit="submitForm(event)">
          <div class="field"><label>${tt('formNameLabel')}</label><input type="text" value="${escapeHtml(state.formState.name)}" oninput="state.formState.name=this.value" placeholder="${tt('formNamePlaceholder')}"></div>
          <div class="field"><label>${tt('formEmployeeIdLabel')}</label><input type="text" value="${escapeHtml(state.formState.employeeId)}" oninput="state.formState.employeeId=this.value" placeholder="${tt('formEmployeeIdPlaceholder')}"></div>
          <div class="field"><label>${tt('formTeamLabel')}</label>
            <select onchange="state.formState.team=this.value">
              <option value="">${tt('formTeamPlaceholder')}</option>
              ${TEAMS.map(tm => `<option value="${tm}" ${state.formState.team===tm?'selected':''}>${tm}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>${tt('formBranchLabel')}</label>
            <select onchange="state.formState.branch=this.value">
              <option value="">${tt('formBranchPlaceholder')}</option>
              ${BRANCHES.map(b => `<option value="${b}" ${state.formState.branch===b?'selected':''}>${b}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>${tt('formProblemLabel')}</label>
            <select onchange="state.formState.problem=this.value">
              <option value="">${tt('formProblemPlaceholder')}</option>
              ${PROBLEMS.map(p => `<option value="${p}" ${state.formState.problem===p?'selected':''}>${tp(p)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>${tt('formDescribeLabel')}</label><textarea oninput="state.formState.description=this.value" placeholder="${tt('formDescribePlaceholder')}">${escapeHtml(state.formState.description)}</textarea></div>
          <button type="submit" class="btn-primary">${tt('formSubmit')}</button>
        </form>
        <div class="link-row"><a onclick="state.route='adminLogin'; render();">${tt('adminStaffLink')}</a></div>
      </div>
    `;
  } else if (state.route === 'status') {
    const ticket = await getTicket(state.myTicketId);
    state.ticketSnapshot = ticket;

    if (!ticket) {
      state.route = 'form';
      render();
      return;
    }

    if (ticket.status === 'called' && state.prevStatus !== 'called') {
      playChime();
    }
    state.prevStatus = ticket.status;

    const all = await listTickets();
    const waitingList = all.filter(t => t.status === 'waiting');
    const myPos = waitingList.findIndex(t => t.id === ticket.id);
    const ahead = myPos >= 0 ? myPos : 0;

    const now = Date.now();
    const canPing = !ticket.lastPingAt || (now - ticket.lastPingAt >= PING_COOLDOWN_MS);
    const cdMs = canPing ? 0 : PING_COOLDOWN_MS - (now - ticket.lastPingAt);

    bodyContent = `
      <div class="card status-center">
        <div class="status-pill ${ticket.status}">
          <div class="blip"></div> ${tt('status' + ticket.status.charAt(0).toUpperCase() + ticket.status.slice(1))}
        </div>
        
        <div class="board-wrap">
          <div class="board">
            ${ticket.ticketNumber.split('').map(c => `<div class="tile ${c==='-'?'dash':''}">${c}</div>`).join('')}
          </div>
        </div>
        <div class="queue-label">${tt('statusNumberLabel')}</div>

        ${ticket.status === 'called' ? `<div class="called-banner">${tt('statusCalledBanner')}</div>` : ''}

        ${ticket.message ? `
          <div class="message-card">
            <div class="m-title">${tt('statusMessageTitle')}</div>
            <div class="m-body">${escapeHtml(ticket.message)}</div>
          </div>
        ` : ''}

        ${ticket.status === 'waiting' ? `
          <div class="queue-num">${ahead}</div>
          <div class="queue-label">${tt('statusQueue')}</div>
          <button class="ping-btn" ${!canPing?'disabled':''} onclick="handlePing()">
            ${canPing ? tt('pingButton') : fmt(tt('pingCooldown'), {time: countdown(cdMs)})}
          </button>
        ` : ''}

        <div style="margin-top: 24px;">
          <button class="control" onclick="state.route='form'; render();">${tt('newTicketButton')}</button>
        </div>
      </div>
    `;
  } else if (state.route === 'adminLogin') {
    bodyContent = `
      <div class="card">
        <h1>${tt('adminLoginTitle')}</h1>
        <div class="sub">${tt('adminLoginSub')}</div>
        <form onsubmit="
          event.preventDefault();
          if(this.passcode.value === ADMIN_PASSCODE){ state.isAdmin=true; state.route='adminDash'; }
          else { toast(tt('adminWrongPasscode')); }
          render();
        ">
          <div class="field"><label>${tt('adminPasscodeLabel')}</label><input type="password" name="passcode" placeholder="${tt('adminPasscodePlaceholder')}"></div>
          <button class="btn-primary" type="submit">${tt('adminLoginButton')}</button>
        </form>
        <div class="link-row"><a onclick="state.route='form'; render();">${tt('backToForm')}</a></div>
      </div>
    `;
  } else if (state.route === 'adminDash') {
    if (!state.isAdmin) { state.route = 'adminLogin'; render(); return; }
    const all = await listTickets();

    const filtered = all.filter(t => {
      if (state.adminBranch !== 'all' && t.branch !== state.adminBranch) return false;
      if (state.adminSearch) {
        const q = state.adminSearch.toLowerCase();
        return t.name.toLowerCase().includes(q) || t.employeeId.toLowerCase().includes(q) || t.ticketNumber.toLowerCase().includes(q);
      }
      return true;
    });

    const lanes = {
      waiting: filtered.filter(t => t.status === 'waiting'),
      called: filtered.filter(t => t.status === 'called'),
      in_progress: filtered.filter(t => t.status === 'in_progress'),
      history: filtered.filter(t => ['resolved','cancelled'].includes(t.status))
    };

    const renderCard = (t) => `
      <div class="tcard">
        <div class="tcard-top">
          <div>
            <div class="tcard-num">${t.ticketNumber}</div>
            <div class="tcard-name">${escapeHtml(t.name)} (${t.employeeId})</div>
          </div>
          <span class="tcard-problem">${tp(t.problem)}</span>
        </div>
        <div class="tcard-meta">${t.branch} • ${t.team} • ${timeAgo(t.submittedAt)} ago</div>
        ${t.description ? `<div class="tcard-meta" style="margin-top:6px; color:var(--ink);">${escapeHtml(t.description)}</div>` : ''}
        ${t.lastPingAt ? `<div class="tcard-pinged">⚠️ ${fmt(tt('adminPinged'), {time: timeAgo(t.lastPingAt)})} (${t.pingCount}x)</div>` : ''}
        
        <div class="tcard-actions">
          ${t.status === 'waiting' ? `<button onclick="updateStatus('${t.id}','called')">${tt('adminCall')}</button>` : ''}
          ${t.status === 'called' ? `<button onclick="updateStatus('${t.id}','in_progress')">${tt('adminStart')}</button>` : ''}
          ${['waiting','called','in_progress'].includes(t.status) ? `
            <button onclick="state.adminMsgOpen = state.adminMsgOpen === '${t.id}' ? null : '${t.id}'; render();">${tt('adminMessage')}</button>
            <button onclick="updateStatus('${t.id}','resolved')">${tt('adminResolve')}</button>
            <button class="danger" onclick="updateStatus('${t.id}','cancelled')">${tt('adminCancel')}</button>
          ` : ''}
        </div>

        <div class="msg-box ${state.adminMsgOpen === t.id ? 'open' : ''}">
          <textarea id="msg-${t.id}" placeholder="${tt('adminMessagePlaceholder')}">${t.message || ''}</textarea>
          <button class="control" onclick="sendAdminMessage('${t.id}', document.getElementById('msg-${t.id}').value)">${tt('adminSend')}</button>
        </div>
      </div>
    `;

    bodyContent = `
      <div class="admin-shell">
        <div class="admin-top">
          <h1>${tt('adminDashTitle')}</h1>
          <div class="admin-filters">
            <input type="text" placeholder="${tt('adminSearchPlaceholder')}" value="${escapeHtml(state.adminSearch)}" oninput="state.adminSearch=this.value; render();">
            <select class="control" onchange="state.adminBranch=this.value; render();">
              <option value="all">${tt('adminAllBranches')}</option>
              ${BRANCHES.map(b => `<option value="${b}" ${state.adminBranch===b?'selected':''}>${b}</option>`).join('')}
            </select>
            <button class="control" onclick="state.isAdmin=false; state.route='form'; render();">${tt('adminLogout')}</button>
          </div>
        </div>

        <div class="lanes">
          ${['waiting','called','in_progress'].map(laneKey => `
            <div class="lane ${laneKey}">
              <div class="lane-head">
                <div class="lane-title"><div class="swatch"></div>${tt('lane' + laneKey.charAt(0).toUpperCase() + laneKey.slice(1))}</div>
                <div class="lane-count">${lanes[laneKey].length}</div>
              </div>
              ${lanes[laneKey].length === 0 ? `<div class="empty-note">${tt('adminNoTickets')}</div>` : lanes[laneKey].map(renderCard).join('')}
            </div>
          `).join('')}
        </div>

        <div class="history-toggle" onclick="state.historyOpen=!state.historyOpen; render();">
          ${state.historyOpen ? tt('adminHideHistory') : tt('adminHistory')} (${lanes.history.length})
        </div>

        <div class="history-list ${state.historyOpen ? 'open' : ''}">
          ${lanes.history.map(t => `
            <div class="history-row">
              <div><strong>${t.ticketNumber}</strong> - ${escapeHtml(t.name)} (${t.branch})</div>
              <div><span class="status-pill ${t.status}">${t.status}</span></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  root.innerHTML = renderTopbar() + `<main>${bodyContent}</main>`;
}

function render() {
  renderApp();
}

/* AUTOMATIC REFRESH LOOP FOR LIVE QUEUE UPDATES */
setInterval(() => {
  if (state.route === 'status' || state.route === 'adminDash') {
    render();
  }
}, TICK_MS);

// Initial Load
render();
</script>
